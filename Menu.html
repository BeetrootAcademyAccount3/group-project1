<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/menubook.css" />
    <link rel="stylesheet" href="./css/headerFooter.css" />

    <title>Menu Page</title>
  </head>
  <body>
    <header class="header">
      <a id="paw" href="index.html"
        ><img src="./assets/svg/paw-solid.svg" alt=""
      /></a>
      <a href="#" id="aboutUs">About us</a>
      <a href="Menu.html" id="menu">Menu</a>
      <a href="Application.html" id="careers">Careers</a>
      <a href="#" id="buttonOrder">ORDER NOW</a>
    </header>
    <main>
      <section class="menu-card">
        <h1 class="menu-title">Our Menu</h1>
        <section class="menu-card-selection">
          <div class="nonalco-card">
            <h3 class="selection-icon-title">Non-Alcohol</h3>
            <img
              src="./assets/img/nonAlcoholicBeveragesIntro.jpg"
              alt="Non-Alcohol Beverage"
            />
          </div>
          <div class="alcohol-card">
            <h3 class="selection-icon-title">Alcohol</h3>
            <img src="./assets/img/alcohol.png" alt="Alcoholic drinks" />
          </div>
          <div class="maindish-card">
            <h3 class="selection-icon-title icon-title-maindish">Main</h3>
            <img src="./assets/img/main.jpg" alt="Main dish plates" />
          </div>
          <div class="desserts-card">
            <h3 class="selection-icon-title icon-title-desserts">Desserts</h3>
            <img src="./assets/img/desserts.jpg" alt="treats and desserts" />
          </div>
          <div class="appetizer-card">
            <h3 class="selection-icon-title">Appetizers</h3>
            <img src="./assets/img/Appetizer.jpg" alt="Appetizers" />
          </div>
          <div class="salads-card">
            <h3 class="selection-icon-title">Salads</h3>
            <img src="./assets/img/Salads.PNG" alt="Salads variety" />
          </div>
          <div class="sauses-card">
            <h3 class="selection-icon-title">Sauces</h3>
            <img src="./assets/img/sauses.jpeg" alt="Side sauces" />
          </div>
        </section>
      </section>
      <aside class="social-button_whatsapp">
        <a href="#"
          ><img src="./assets/svg/whatsapp.svg" alt="Whatsapp-button"
        /></a>
      </aside>
    </main>

    <footer class="footer">
      <div id="allRights">© All Rights Reserved 2023</div>
      <div id="socialButtonsContainer">
        <a href="#" id="buttonInsta"></a>
        <a href="#" id="buttonFb"></a>
        <a href="#" id="buttonLinked"></a>
      </div>
    </footer>
  </body>
</html>
