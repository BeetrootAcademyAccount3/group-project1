<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="./css/styles.min.css" rel="stylesheet" />

    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div id="paw"></div>
      <a href="./aboutUsPage.html" id="aboutUs">About us</a>
      <a href="./ourMenus.html" id="menu">Menu</a>
      <a href="#" id="careers">Careers</a>
      <a href="#" id="buttonOrder">ORDER NOW</a>
    </header>
    <main class="main">
      <section class="menu">
        <h1 class="menu-header">Our Menu</h1>
        <div class="img-main-block">
          <div class="row top">
            <div class="image-container">
              <img
                class="menu-item small"
                src="/assets/img/nonAlcoholicBeveragesIntro.jpg"
                alt="Non-Alcoholic Beverages"
                loading="lazy"
              />
              <div class="text-overlay">Non-Alcohol</div>
            </div>
            <div class="image-container full-height">
              <img
                class="menu-item small full-height"
                src="/assets/img/main.jpg"
                alt="Non-Alcoholic Beverages"
                loading="lazy"
              />
              <div class="text-overlay">Main</div>
            </div>
          </div>
          <div class="row middle">
            <div class="image-container">
              <img
                class="menu-item small"
                src="/assets/img/alcohol.png"
                alt="Non-Alcoholic Beverages"
                loading="lazy"
              />
              <div class="text-overlay">Alcohol</div>
            </div>
            <div class="image-container">
              <img
                class="menu-item small"
                src="/assets/img/Appetizer.jpg"
                alt="Non-Alcoholic Beverages"
                loading="lazy"
              />
              <div class="text-overlay">Appetizers</div>
            </div>
            <div class="image-container">
              <img
                class="menu-item small"
                src="/assets/img/Salads.PNG"
                alt="Non-Alcoholic Beverages"
                loading="lazy"
              />
              <div class="text-overlay">Salads</div>
            </div>
            <div class="image-container">
              <img
                class="menu-item small"
                src="/assets/img/sauses.jpeg"
                alt="Non-Alcoholic Beverages"
                loading="lazy"
              />
              <div class="text-overlay">Sauses</div>
            </div>
          </div>
        </div>
        <div class="image-container">
          <img
            class="menu-item small"
            src="/assets/img/desserts.jpg"
            alt="Non-Alcoholic Beverages"
            loading="lazy"
          />
          <div class="text-overlay">Desserts</div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="allRights">© All Rights Reserved 2023</div>
      <div class="socialButtonsContainer">
        <a href="#" class="buttonInsta"></a>
        <a href="#" class="buttonFb"></a>
        <a href="#" class="buttonLinked"></a>
      </div>
    </footer>

</html>
