<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="./css/styles.min.css" rel="stylesheet" />

    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div id="paw"></div>
      <a href="./aboutUsPage.html" id="aboutUs">About us</a>
      <a href="./ourMenus.html" id="menu">Menu</a>
      <a href="#" id="careers">Careers</a>
      <a href="#" id="buttonOrder">ORDER NOW</a>
    </header>
    <main class="main">
      <section class="menu">
        <h1 class="menu-header">Our Menu</h1>
        <div class="img-main-block">
          <div class="row top">
            <img
              class="menu-item small"
              src="/assets/img/nonAlcoholicBeveragesIntro.jpg"
              alt="Non-Alcoholic Beverages"
              loading="lazy"
            />
            <img
              class="menu-item main"
              src="/assets/img/main.jpg"
              alt="Main"
              loading="lazy"
            />
          </div>

          <div class="row middle">
            <img
              class="menu-item small"
              src="/assets/img/alchohol.png"
              alt="Alcoholic Beverages"
              loading="lazy"
            />
            <img
              class="menu-item small"
              src="/assets/img/Appetizer.jpg"
              alt="Appetizer"
              loading="lazy"
            />
            <img
              class="menu-item small"
              src="/assets/img/Salads.PNG"
              alt="Salads"
              loading="lazy"
            />
            <img
              class="menu-item small"
              src="/assets/img/sauses.jpeg"
              alt="Sauces"
              loading="lazy"
            />
          </div>
        </div>

        <img
          class="menu-item large"
          src="/assets/img/deserts.jpg"
          alt="Deserts"
          loading="lazy"
        />
      </section>
    </main>
  </body>
</html>
